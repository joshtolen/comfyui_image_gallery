<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComfyUI Gallery</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .logo {
      max-width: 300px;
      margin-bottom: 2rem;
    }
    .button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background-color: #6c5ce7;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }
    .button:hover {
      background-color: #5352ed;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/api/static/logo.png" alt="ComfyUI Gallery Logo" class="logo">
    <h1>ComfyUI Gallery</h1>
    <p>Welcome to the ComfyUI Gallery. Browse and manage your ComfyUI output images and videos.</p>
    <a href="/" class="button">View Gallery</a>
  </div>
</body>
</html>
