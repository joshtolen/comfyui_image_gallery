[package]
name = "comfyui_image_gallery"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.3.1"
actix-files = "0.6.2"
actix-cors = "0.6.4"

# Template engine
tera = "1.18.1"

# Serialization/deserialization
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"

# Async runtime
tokio = { version = "1.28.2", features = ["full"] }

# Image processing
image = "0.24.6"

# Video processing dependencies
ffmpeg-next = "6.0.0"

# Utility
futures = "0.3.28"
chrono = "0.4.26"
mime = "0.3.17"
mime_guess = "2.0.4"
uuid = { version = "1.3.3", features = ["v4"] }
anyhow = "1.0.71"
thiserror = "1.0.40"
log = "0.4.19"
env_logger = "0.10.0"
lazy_static = "1.4.0"
regex = "1.8.4"
filetime = "0.2.21"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
